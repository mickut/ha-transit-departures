[project]
name = "ha-transit-departures"
version = "0.4.0"
description = "Home Assistant custom integration for FinTraffic departures"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "mickut" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
test = [
  "homeassistant>=2026.11.0",
  "pytest>=9.0.0",
  "pytest-asyncio>=1.3.0",
  "pytest-cov>=7.0.0",
  "pytest-socket>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
